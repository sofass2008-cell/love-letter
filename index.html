
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: "Courier New", monospace;
    user-select: none;
}

#screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.bunny-track {
    position: absolute;
    left: 50%;
    top: 81%;
    width: 440px;
    max-width: 85vw;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 5;
    animation: bunnyAppear 3s ease-out forwards;
}

@keyframes bunnyAppear {
    from {
        opacity: 0;
        transform: translate(-50%, -45%);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%);
    }
}

.bunny-track img {
    display: block;
    width: 100%;
    height: auto;
    filter:
        drop-shadow(0 0 8px rgba(255, 210, 235, 0.65))
        drop-shadow(0 0 22px rgba(255, 130, 190, 0.35));
    animation: bunnyGlow 3s ease-in-out infinite alternate;
}

.bunny-jump {
    animation: bunnyJumpAnim 0.55s ease !important;
}

@keyframes bunnyJumpAnim {
    0%   { transform: translateY(0) scale(1); }
    25%  { transform: translateY(8px) scale(1.05, 0.94); }
    55%  { transform: translateY(-35px) scale(0.96, 1.05); }
    100% { transform: translateY(0) scale(1); }
}

@keyframes bunnyGlow {
    from {
        filter:
            drop-shadow(0 0 6px rgba(255, 220, 240, 0.45))
            drop-shadow(0 0 14px rgba(255, 140, 195, 0.2));
    }
    to {
        filter:
            drop-shadow(0 0 12px rgba(255, 225, 245, 0.9))
            drop-shadow(0 0 28px rgba(255, 130, 195, 0.55));
    }
}

@media (max-height: 600px) {
    .bunny-track {
        width: 320px;
    }
}
</style>
</head>

<body>

<canvas id="screen"></canvas>

<div class="bunny-track" id="bunnyTrack">
    <img src="bunny.webp" alt="Bunny" id="bunnyImg">
</div>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const symbols = "01#%$@&*+=:;?!№()";

let W, H, DPR;

let textCanvas;
let textCtx;
let textPixels;

let phraseCanvas;
let phraseCtx;
let phrasePixels;

let hintCanvas;
let hintCtx;
let hintPixels;

let hintAlpha = 1;
let phraseAlpha = 0;
let phraseShowTimer = 0;

const snowflakes = [];
const hearts = [];

let snowPile = [];
const pileStep = 4;

// =================================
// RESIZE
// =================================

function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    createText();
    createPhrase();
    createHint();
    initSnowPile();
}

// =================================
// SNOW
// =================================

function initSnowPile() {
    const cols = Math.ceil(W / pileStep) + 1;
    snowPile = new Array(cols).fill(0);
}

function initSnow() {
    snowflakes.length = 0;

    for (let i = 0; i < 150; i++) {
        snowflakes.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 2 + 0.8,
            speedY: Math.random() * 0.9 + 0.4,
            wobble: Math.random() * Math.PI * 2
        });
    }
}

// =================================
// MAIN TEXT
// =================================

function createText() {
    textCanvas = document.createElement("canvas");
    textCtx = textCanvas.getContext("2d");

    textCanvas.width = W;
    textCanvas.height = H;

    const size = Math.min(110, W * 0.10);

    textCtx.font = `bold ${size}px Courier New`;
    textCtx.textAlign = "center";
    textCtx.textBaseline = "middle";
    textCtx.fillStyle = "white";

    textCtx.fillText("I LOVE YOU", W / 2, H * 0.38);

    textPixels = textCtx.getImageData(0, 0, W, H).data;
}

function drawText(time) {
    const cellW = 9;
    const cellH = 13;

    ctx.font = "12px Courier New";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const appear = Math.min(time / 3000, 1);
    const glow = (Math.sin(time * 0.0015) + 1) / 2;

    for (let y = 0; y < H; y += cellH) {
        for (let x = 0; x < W; x += cellW) {
            const px = Math.min(W - 1, x + 4);
            const py = Math.min(H - 1, y + 6);
            const index = (py * W + px) * 4 + 3;

            if (textPixels[index] > 80) {
                const gx = Math.floor(x / cellW);
                const gy = Math.floor(y / cellH);

                const flicker = Math.sin(time * 0.002 + gx * 0.7 + gy);

                const symbol = symbols[
                    (gx * 7 + gy * 11 + Math.floor(time / 180)) % symbols.length
                ];

                const pink = 185 + glow * 35;
                const green = 145 + glow * 35;

                ctx.shadowColor = `rgba(255, 120, 190, ${0.5 + glow * 0.5})`;
                ctx.shadowBlur = 8 + glow * 15;

                ctx.fillStyle = `rgba(255, ${green}, ${pink}, ${appear * (0.75 + flicker * 0.15)})`;

                ctx.fillText(symbol, x + cellW / 2, y + cellH / 2);
            }
        }
    }

    ctx.shadowBlur = 0;
}

// =================================
// SECOND PHRASE
// =================================

function createPhrase() {
    phraseCanvas = document.createElement("canvas");
    phraseCtx = phraseCanvas.getContext("2d");

    phraseCanvas.width = W;
    phraseCanvas.height = H;

    const size = Math.min(58, W * 0.075);

    phraseCtx.font = `bold ${size}px Arial`;
    phraseCtx.textAlign = "center";
    phraseCtx.textBaseline = "middle";
    phraseCtx.fillStyle = "white";

    phraseCtx.fillText("ТЫ МОЯ ПРЕЛЕСТЬ", W / 2, H * 0.56);

    phrasePixels = phraseCtx.getImageData(0, 0, W, H).data;
}

function drawPhrase(time) {
    if (phraseShowTimer > 0) {
        phraseShowTimer--;
        phraseAlpha = Math.min(1, phraseAlpha + 0.05);
    } else {
        phraseAlpha = Math.max(0, phraseAlpha - 0.025);
    }

    if (phraseAlpha <= 0.01) return;

    const cellW = 5;
    const cellH = 7;

    ctx.font = "8px Courier New";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const glow = (Math.sin(time * 0.002) + 1) / 2;

    for (let y = 0; y < H; y += cellH) {
        for (let x = 0; x < W; x += cellW) {
            const px = Math.min(W - 1, x + 2);
            const py = Math.min(H - 1, y + 3);
            const index = (py * W + px) * 4 + 3;

            if (phrasePixels[index] > 80) {
                const gx = Math.floor(x / cellW);
                const gy = Math.floor(y / cellH);

                const flicker = Math.sin(time * 0.002 + gx * 0.7 + gy);

                const symbol = symbols[
                    (gx * 7 + gy * 11 + Math.floor(time / 180)) % symbols.length
                ];

                const pink = 195 + glow * 35;
                const green = 155 + glow * 35;

                ctx.shadowColor = `rgba(255, 120, 190, ${0.5 + glow * 0.5})`;
                ctx.shadowBlur = 6 + glow * 10;

                ctx.fillStyle = `rgba(255, ${green}, ${pink}, ${phraseAlpha * (0.8 + flicker * 0.15)})`;

                ctx.fillText(symbol, x + cellW / 2, y + cellH / 2);
            }
        }
    }

    ctx.shadowBlur = 0;
}

// =================================
// CLICK HINT
// =================================

function createHint() {
    hintCanvas = document.createElement("canvas");
    hintCtx = hintCanvas.getContext("2d");

    hintCanvas.width = W;
    hintCanvas.height = H;

    const size = Math.min(32, W * 0.055);

    hintCtx.font = `${size}px Arial`;
    hintCtx.textAlign = "center";
    hintCtx.textBaseline = "middle";
    hintCtx.fillStyle = "white";

    hintCtx.fillText(
        "НАЖМИ НА КРОЛИКА",
        W / 2,
        H * 0.55
    );

    hintPixels = hintCtx.getImageData(0, 0, W, H).data;
}

function drawHint(time) {
    if (hintAlpha <= 0.01) return;

    const cellW = 3;
    const cellH = 4;

    const glow = (Math.sin(time * 0.002) + 1) / 2;

    ctx.font = "4px Courier New";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (let y = 0; y < H; y += cellH) {
        for (let x = 0; x < W; x += cellW) {
            const px = Math.min(W - 1, x + 1);
            const py = Math.min(H - 1, y + 2);

            const index = (py * W + px) * 4 + 3;

            if (hintPixels[index] > 100) {
                const gx = Math.floor(x / cellW);
                const gy = Math.floor(y / cellH);

                const flicker = Math.sin(time * 0.002 + gx * 0.7 + gy);

                const symbolIndex =
                    Math.abs(gx * 7 + gy * 11 + Math.floor(time / 220)) % symbols.length;

                const symbol = symbols[symbolIndex];

                ctx.shadowColor = `rgba(255, 120, 190, ${0.5 + glow * 0.4})`;
                ctx.shadowBlur = 5 + glow * 8;

                ctx.fillStyle = `rgba(255, ${185 + glow * 25}, ${215 + glow * 20}, ${hintAlpha * (0.8 + flicker * 0.1)})`;

                ctx.fillText(symbol, x + cellW / 2, y + cellH / 2);
            }
        }
    }

    ctx.shadowBlur = 0;
}

// =================================
// SNOW DRAWING
// =================================

function drawSnow(time) {
    const appear = Math.min(time / 2000, 1);
    const maxPileHeight = H * 0.08;

    for (let i = 0; i < snowflakes.length; i++) {
        const s = snowflakes[i];

        s.wobble += 0.02;
        s.x += Math.sin(s.wobble) * 0.35;
        s.y += s.speedY;

        if (s.x < 0) s.x = W;
        if (s.x > W) s.x = 0;

        const col = Math.floor(s.x / pileStep);
        const pileH = snowPile[col] || 0;

        if (s.y >= H - pileH) {
            if (pileH < maxPileHeight) {
                if (snowPile[col] !== undefined) snowPile[col] += 0.4;
                if (snowPile[col - 1] !== undefined) snowPile[col - 1] += 0.25;
                if (snowPile[col + 1] !== undefined) snowPile[col + 1] += 0.25;
            }

            s.y = -5;
            s.x = Math.random() * W;
            continue;
        }

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 235, 245, ${0.65 * appear})`;
        ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(0, H);

    for (let i = 0; i < snowPile.length; i++) {
        ctx.lineTo(i * pileStep, H - snowPile[i]);
    }

    ctx.lineTo(W, H);
    ctx.closePath();

    ctx.fillStyle = "rgba(255, 225, 240, 0.9)";
    ctx.fill();
}

// =================================
// HEARTS
// =================================

function drawHeartShape(x, y, size, color, alpha) {
    ctx.save();

    ctx.translate(x, y);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;

    ctx.beginPath();

    const topCurveHeight = size * 0.3;

    ctx.moveTo(0, topCurveHeight);

    ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);

    ctx.bezierCurveTo(
        -size / 2,
        (size + topCurveHeight) / 2,
        0,
        (size + topCurveHeight) / 1.4,
        0,
        size
    );

    ctx.bezierCurveTo(
        0,
        (size + topCurveHeight) / 1.4,
        size / 2,
        (size + topCurveHeight) / 2,
        size / 2,
        topCurveHeight
    );

    ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);

    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function spawnHearts(x, y) {
    const colors = [
        "#ff7eb9",
        "#ff9ece",
        "#ffd1e6",
        "#ffffff",
        "#ff5ca8"
    ];

    for (let i = 0; i < 30; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
        const speed = Math.random() * 7 + 3;

        hearts.push({
            x: x + (Math.random() - 0.5) * 30,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            size: Math.random() * 12 + 10,
            alpha: 1,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function drawHearts() {
    for (let i = hearts.length - 1; i >= 0; i--) {
        const h = hearts[i];

        h.x += h.vx;
        h.y += h.vy;
        h.vy += 0.15;
        h.alpha -= 0.012;

        if (h.alpha <= 0) {
            hearts.splice(i, 1);
            continue;
        }

        drawHeartShape(h.x, h.y, h.size, h.color, h.alpha);
    }
}

// =================================
// BUNNY INTERACTION
// =================================

const bunnyTrack = document.getElementById("bunnyTrack");
const bunnyImg = document.getElementById("bunnyImg");

function handleBunnyClick() {
    bunnyImg.classList.remove("bunny-jump");

    void bunnyImg.offsetWidth;

    bunnyImg.classList.add("bunny-jump");

    phraseShowTimer = 180;

    hintAlpha = 0;

    const rect = bunnyTrack.getBoundingClientRect();

    spawnHearts(
        rect.left + rect.width / 2,
        rect.top + rect.height * 0.4
    );
}

bunnyTrack.addEventListener("click", handleBunnyClick);

// =================================
// MAIN ANIMATION
// =================================

function animate(time) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    drawSnow(time);
    drawText(time);
    drawPhrase(time);
    drawHint(time);
    drawHearts();

    requestAnimationFrame(animate);
}

// =================================
// START
// =================================

window.addEventListener("resize", () => {
    resize();
    initSnow();
});

resize();
initSnow();

requestAnimationFrame(animate);

</script>

</body>
</html>
